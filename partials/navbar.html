<!-- ════════════════════════════════════════════════════════════════════
     NAVBAR CANÓNICA — Maison Lumière
     ────────────────────────────────────────────────────────────────────
     FUENTE ÚNICA de la barra de navegación. El bloque entre
     "BEGIN navbar" y "END navbar" se pega IDÉNTICO en las 5 páginas
     (index, catalogo, producto, carrito y checkout). Así el cliente ve
     siempre la misma barra y, si hay que cambiarla, se cambia aquí y se
     replica en todas.

     ¿Qué contiene? (requisito del proyecto)
     · Logo (monograma ML + nombre de la marca)
     · Buscador (envía a catalogo.html con lo escrito, sin JavaScript)
     · Menú de cuenta de usuario y acceso al carrito
     · Menú móvil: usa <details>, un desplegable NATIVO de HTML,
       por eso funciona sin una sola línea de JavaScript.

     ¿Cómo se marca la página activa?
     Cada enlace lleva data-nav="nombre". En cada página, el enlace que
     corresponde lleva además aria-current="page": los lectores de
     pantalla lo anuncian como "página actual" y el CSS lo pinta en rojo.

     Este archivo NO se sirve al navegador: es solo la referencia.
     ════════════════════════════════════════════════════════════════════ -->
<!-- BEGIN navbar (canónico) -->

<!-- Enlace de accesibilidad: invisible salvo que se navegue con la
     tecla Tab; permite saltar directo al contenido principal -->
<a href="#contenido"
   class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-50 focus:bg-tinta focus:px-4 focus:py-2 focus:text-crudo">
  Saltar al contenido
</a>

<!-- Barra de promoción: mensaje comercial fijo en todas las vistas -->
<p class="border-b border-tinta/20 bg-crudo px-[clamp(20px,5vw,72px)] py-2 text-[13px] uppercase tracking-[0.08em] text-tinta/70">
  Envío gratuito a partir de 150 € — devoluciones en 30 días
</p>

<header class="border-b-2 border-tinta/40 bg-crudo">
  <div class="contenedor flex items-center gap-6 py-3.5">

    <!-- Logo: monograma ML dibujado en SVG + nombre de la marca.
         mr-auto empuja el resto de la barra hacia la derecha -->
    <a href="index.html" class="mr-auto flex items-center gap-3" aria-label="Maison Lumière, ir al inicio">
      <svg width="26" height="26" viewBox="0 0 48 48" aria-hidden="true" fill="none"
           stroke="var(--color-acento)" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M8 34 L8 14 L16 26 L24 14 L24 34"/>
        <path d="M30 14 L30 34 L40 34"/>
      </svg>
      <span class="text-[15px] font-extrabold uppercase tracking-[0.14em]">Maison Lumière</span>
    </a>

    <!-- Buscador (visible solo en escritorio; en móvil va dentro del menú) -->
    <form role="search" action="catalogo.html" method="get" class="hidden lg:block">
      <label for="buscador" class="sr-only">Buscar productos</label>
      <input id="buscador" name="q" type="search" placeholder="Buscar en el catálogo" class="campo w-[220px] py-2">
    </form>

    <!-- Navegación principal + menú de cuenta (escritorio) -->
    <nav aria-label="Principal" class="hidden items-center gap-6 text-[14px] lg:flex">
      <a data-nav="inicio" href="index.html" class="hover:text-acento">Inicio</a>
      <a data-nav="catalogo" href="catalogo.html" class="hover:text-acento">Catálogo</a>
      <a href="#" class="flex items-center gap-1.5 hover:text-acento" title="Tu cuenta (maqueta sin funcionalidad)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="square" aria-hidden="true">
          <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>
        </svg>
        Cuenta
      </a>
    </nav>

    <!-- Carrito: visible SIEMPRE (móvil y escritorio), con contador
         de artículos. El "4" es el estado de ejemplo del prototipo:
         coincide con las unidades de la vista carrito.html -->
    <a data-nav="carrito" href="carrito.html" class="flex items-center gap-2 text-[14px] hover:text-acento"
       aria-label="Carrito, 4 artículos">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
        <path d="M3 6h18"/>
        <path d="M16 10a4 4 0 0 1-8 0"/>
      </svg>
      <span class="hidden sm:inline">Carrito</span>
      <span aria-hidden="true"
            class="inline-flex h-[18px] min-w-[18px] items-center justify-center bg-acento-fuerte px-1 text-[11px] font-semibold tabular-nums text-white">4</span>
    </a>

    <!-- Menú móvil: <details> abre y cierra el panel sin JavaScript -->
    <details class="relative lg:hidden">
      <summary class="cursor-pointer p-2" aria-label="Abrir menú de navegación">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="square" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </summary>
      <div class="absolute right-0 z-40 mt-3 w-64 border-2 border-tinta/40 bg-crudo p-5 shadow-lg">
        <form role="search" action="catalogo.html" method="get" class="mb-4">
          <label for="buscador-movil" class="sr-only">Buscar productos</label>
          <input id="buscador-movil" name="q" type="search" placeholder="Buscar…" class="campo py-2">
        </form>
        <nav aria-label="Principal (móvil)" class="flex flex-col gap-4 text-[14px]">
          <a data-nav="inicio" href="index.html" class="hover:text-acento">Inicio</a>
          <a data-nav="catalogo" href="catalogo.html" class="hover:text-acento">Catálogo</a>
          <a data-nav="carrito" href="carrito.html" class="hover:text-acento">Carrito</a>
          <a href="#" class="hover:text-acento">Cuenta</a>
        </nav>
      </div>
    </details>
  </div>
</header>
<!-- END navbar (canónico) -->
